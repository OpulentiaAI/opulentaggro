# OpulentAggro ERPNext — Railway supervisord template
#
# This file is rendered by `envsubst` in the entrypoint into /home/frappe/supervisor.conf.
# Path substitutions: $PATH, $HOME, $NVM_DIR, $NODE_VERSION.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:bench-frappe-web]
command=/home/frappe/frappe-bench/env/bin/gunicorn frappe.app:application --bind 127.0.0.1:8000 --worker-class=gthread --workers=2 --threads=4 --timeout 120 --graceful-timeout 30 --preload
priority=2
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
user=frappe
directory=/home/frappe/frappe-bench/sites

[program:bench-node-socketio]
command=${NVM_DIR}/versions/node/v${NODE_VERSION}/bin/node /home/frappe/frappe-bench/apps/frappe/socketio.js
priority=2
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
user=frappe
directory=/home/frappe/frappe-bench

[group:bench-web]
programs=bench-frappe-web,bench-node-socketio

[program:bench-frappe-default-worker]
command=/home/frappe/.local/bin/bench worker --queue default
priority=4
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
user=frappe
stopwaitsecs=1560
directory=/home/frappe/frappe-bench
killasgroup=true
numprocs=1
process_name=%(program_name)s-%(process_num)d
environment=PATH="${PATH}",HOME="/home/frappe"

[program:bench-frappe-short-worker]
command=/home/frappe/.local/bin/bench worker --queue short
priority=4
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
user=frappe
stopwaitsecs=360
directory=/home/frappe/frappe-bench
killasgroup=true
numprocs=1
process_name=%(program_name)s-%(process_num)d
environment=PATH="${PATH}",HOME="/home/frappe"

[program:bench-frappe-long-worker]
command=/home/frappe/.local/bin/bench worker --queue long
priority=4
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
user=frappe
stopwaitsecs=1560
directory=/home/frappe/frappe-bench
killasgroup=true
numprocs=1
process_name=%(program_name)s-%(process_num)d
environment=PATH="${PATH}",HOME="/home/frappe"

[program:bench-frappe-schedule]
command=/home/frappe/.local/bin/bench schedule
priority=3
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
user=frappe
directory=/home/frappe/frappe-bench
environment=PATH="${PATH}",HOME="/home/frappe"

[group:bench-workers]
programs=bench-frappe-default-worker,bench-frappe-short-worker,bench-frappe-long-worker,bench-frappe-schedule

[supervisorctl]
