# OpulentAggro ERPNext — Railway nginx config
# Proxies public traffic (port 80) to gunicorn (127.0.0.1:8000).
# Static assets are served directly from the sites volume.
#
# SITE_HOST and PORT are substituted by entrypoint via envsubst.

upstream bench-frappe {
	server 127.0.0.1:8000 fail_timeout=0;
}

upstream bench-socketio-server {
	server 127.0.0.1:9000 fail_timeout=0;
}

server {
	listen 80 default_server;
	server_name _;
	root /home/frappe/frappe-bench/sites;

	client_max_body_size 50m;

	location /assets {
		try_files $uri =404;
	}

	location ~ ^/protected/(.*) {
		internal;
		try_files /${SITE_HOST}/$1 =404;
	}

	location /socket.io {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header X-Frappe-Site-Name ${SITE_HOST};
		proxy_set_header Origin $scheme://$http_host;
		proxy_set_header Host $host;

		proxy_pass http://bench-socketio-server;
	}

	location / {
		try_files /${SITE_HOST}/public/$uri @webserver;
	}

	location @webserver {
		proxy_set_header X-Robots-Tag noindex;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Frappe-Site-Name ${SITE_HOST};
		proxy_set_header Host $host;
		proxy_set_header X-Use-X-Accel-Redirect True;
		proxy_read_timeout 120;
		proxy_redirect off;

		proxy_pass http://bench-frappe;
	}

	gzip on;
	gzip_http_version 1.1;
	gzip_comp_level 5;
	gzip_min_length 256;
	gzip_proxied any;
	gzip_vary on;
	gzip_types
		application/atom+xml
		application/javascript
		application/json
		application/rss+xml
		application/vnd.ms-fontobject
		application/x-font-ttf
		application/font-woff
		application/x-web-app-manifest+json
		application/xhtml+xml
		application/xml
		font/opentype
		image/svg+xml
		image/x-icon
		text/css
		text/plain
		text/x-component;
}
